# Daily lightweight Supabase DB activity via existing YDS health API (SELECT only).
# Prevents Free Plan inactivity pause. No INSERT/UPDATE. No CRON_SECRET.
name: supabase-keepalive

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: SELECT ping via /api/supabase/health
        run: |
          set -e
          URL="https://yds-web-kappa.vercel.app/api/supabase/health"
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$URL")
          echo "health_http=$code"
          cat /tmp/health.json
          test "$code" = "200"
          grep -q '"ok":true' /tmp/health.json
